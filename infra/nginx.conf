server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy nginx only sees its internal scheme and port.
    absolute_redirect off;

    # Re-resolve the backend so a backend redeploy does not leave a stale address.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    # Allow large uploads (up to 50MB)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Service worker and manifest must always be revalidated, or an old app could stay forever.
    # Exact matches win over the long-cache regex below.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React SPA — all routes go to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Proxy /api/ requests to the backend service
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp4|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
