# Rendered at container start by the image's envsubst step: only ${CSP_EXTRA_MEDIA_SOURCES} and
# ${HSTS_HEADER_VALUE} are replaced. See docs/self-hosting.md.

# Behind a reverse proxy this nginx only sees plain http, so the proxy's answer is kept.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

# Empty means no header at all: nginx skips add_header with an empty value.
map $forwarded_proto $hsts_header {
    default "";
    https   "${HSTS_HEADER_VALUE}";
}

# The script hash is that of the inline theme script in frontend/index.html (a frontend test compares them).
# Images and video may come from any S3-compatible host, so any https address is allowed.
map $host $content_security_policy {
    default "default-src 'self'; script-src 'self' 'sha256-YMWHEnutzM/7P/AIMekeKEAq0yNk++Lye+CKtT/lsmU='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob: ${CSP_EXTRA_MEDIA_SOURCES}; media-src 'self' https: blob: ${CSP_EXTRA_MEDIA_SOURCES}; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Behind a reverse proxy nginx only sees its internal scheme and port.
    absolute_redirect off;

    # Re-resolve the backend so a backend redeploy does not leave a stale address.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    # Requests other than the uploads below have no business being large. The backend also limits JSON bodies.
    client_max_body_size 5m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Service worker and manifest must always be revalidated, or an old app could stay forever.
    # Exact matches win over the long-cache regex below.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # React SPA — all routes go to index.html
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # The routes that take a file: gallery images, question imports, blog media and PDFs for AI generation.
    # A regular expression wins over the prefix below, and this one has to come before the static assets.
    location ~ ^/api/(gallery|api/blog/manage/media|api/study-areas/[^/]+/questions/import|api/study-areas/[^/]+/ai-generation/jobs|api/ai-generation/jobs/[^/]+/retry)$ {
        client_max_body_size 50m;
        include /etc/nginx/backend-proxy.conf;
    }

    # Proxy /api/ requests to the backend service
    location /api/ {
        include /etc/nginx/backend-proxy.conf;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp4|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
