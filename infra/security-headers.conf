# Included in every location: a location with its own add_header inherits none from the server block.
# $content_security_policy and $hsts_header are defined in nginx.conf.
add_header Content-Security-Policy $content_security_policy always;
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
