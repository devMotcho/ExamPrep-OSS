<!DOCTYPE html>
<html th:lang="${lang}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Reminder</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f7f6;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
<div style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e1e7e6;border-radius:8px;padding:28px;">
    <p style="margin:0 0 16px;font-size:18px;font-weight:bold;" th:text="${greeting}">Hello,</p>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.5;" th:each="line : ${lines}" th:text="${line}">Text</p>
    <p style="margin:24px 0;">
        <a th:href="${ctaUrl}" style="display:inline-block;padding:12px 20px;background-color:#0f766e;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:bold;" th:text="${ctaLabel}">Practise now</a>
    </p>
    <p style="margin:0;font-size:12px;line-height:1.5;color:#64748b;">
        <span th:text="${footerText}">You get this email because you turned on reminders.</span>
        <a th:href="${unsubscribeUrl}" style="color:#64748b;" th:text="${unsubscribeLabel}">Stop reminders</a>
    </p>
</div>
</body>
</html>
