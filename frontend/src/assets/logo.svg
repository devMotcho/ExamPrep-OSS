<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Svg Content with Shadow -->
  <g filter="url(#shadow)">
    <!-- Option Card A (Unselected) -->
    <rect x="96" y="112" width="320" height="72" rx="20" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4" />
    <circle cx="144" cy="148" r="16" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.6" />
    <line x1="184" y1="148" x2="350" y2="148" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />
    
    <!-- Option Card B (Selected / Checked) -->
    <rect x="96" y="220" width="320" height="72" rx="20" fill="#ffffff" />
    <circle cx="144" cy="256" r="20" fill="url(#checkGrad)" />
    <!-- Checkmark icon inside circle -->
    <path d="M134 256 L142 264 L156 248" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="184" y1="256" x2="370" y2="256" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    
    <!-- Option Card C (Unselected) -->
    <rect x="96" y="328" width="320" height="72" rx="20" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4" />
    <circle cx="144" cy="364" r="16" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.6" />
    <line x1="184" y1="364" x2="310" y2="364" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>
